[project]
name = "ml-reliability-lab"
version = "0.1.0"
description = "Trust layer for a frozen CIFAR-10 ResNet-18 (HackGT 13) + Visa snap-to-shop wrapper"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "timm",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "xgboost",
    "scipy",
    "pyyaml",
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "pillow",
    "tqdm",
    "python-dotenv",
    "openai",   # client for an OpenAI-compatible endpoint only (Section 10.4)
    "httpx",    # FastAPI TestClient
    "pytest",
]

[project.optional-dependencies]
# May conflict with NumPy / scikit-image versions. If install fails, see shop/README.md.
shop = ["imagecorruptions"]

[tool.setuptools.packages.find]
include = ["common*", "benchmark*", "inference*", "trust*", "backend*", "shop*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "shop: tests for the Visa wrapper (skipped if shop/ is absent)",
]
