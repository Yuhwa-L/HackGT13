  - sunglasses
  - running shoe
  - sandal
  - Loafer
  - sweatshirt
  - jean
  - cardigan
  - sock
  - wallet
  - purse
  - digital watch
  - coffee mug
  - water bottle
  - teapot
  - frying pan
  - toaster
  - espresso maker
  - laptop
  - computer keyboard
  - mouse
  - cellular telephone
  - iPod
  - binoculars
  - acoustic guitar
  - electric guitar
  - umbrella
  - sleeping bag
